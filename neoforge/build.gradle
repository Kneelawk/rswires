plugins {
    id "java"
    id "org.jetbrains.kotlin.jvm"
    id "dev.architectury.loom"
    id "org.jetbrains.gradle.plugin.idea-ext"
    id "maven-publish"
}

evaluationDependsOn(":xplat")

group = project.maven_group

base {
    archivesName = project.archives_base_name + "-neoforge"
}

apply from: 'https://dblsaiko.net/pub/gradle/autoversion.gradle'

loom {
    mods {
        named("main") {
            sourceSet(project(":xplat").sourceSets.main)
        }
    }
    runs {
        client {
            programArgs "--width", "1280", "--height", "720"
        }
    }
}

repositories {
    maven { url 'https://maven.dblsaiko.net' }
    // maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.neoforged.net/releases/' }
    maven { url 'https://maven.kneelawk.com/releases/' }
    maven { url 'https://thedarkcolour.github.io/KotlinForForge/' }
    mavenLocal()
}

dependencies {
    def optionalProject = { Map<String, Object> depSpec, String projectName, Closure c = {} ->
        def project = findProject(projectName)
        if (project) {
            implementation(project, c)
        } else {
            modImplementation(depSpec, c)
        }
    }

    minecraft group: "com.mojang", name: "minecraft", version: minecraft_version
    mappings loom.layered {
        mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
        mappings "dev.architectury:yarn-mappings-patch-neoforge:${yarn_patch}"
    }

    neoForge group: "net.neoforged", name: "neoforge", version: neoforge_version

    modCompileOnly group: "thedarkcolour", name: "kotlinforforge-neoforge", version: kotlin_for_forge_version
    modLocalRuntime group: "thedarkcolour", name: "kotlinforforge-neoforge", version: kotlin_for_forge_version

    compileOnly(project(path: ":xplat", configuration: "namedElements"))

    // modImplementation group: 'net.dblsaiko', name: 'hctm-base', version: hctm_base_version
    optionalProject ':hctm-base', group: 'net.dblsaiko', name: 'hctm-base-neoforge', version: hctm_base_version
    include group: 'net.dblsaiko', name: 'hctm-base-neoforge', version: hctm_base_version

//    modRuntimeOnly(group: 'net.dblsaiko.qcommon.cfg', name: 'cfg', version: cfg_version) {
//        exclude group: 'net.fabricmc.fabric-api'
//        exclude module: 'cfg-keys'
//    }
//
//    modImplementation(group: 'net.dblsaiko.qcommon.cfg', name: 'cfg-core', version: cfg_core_version) {
//        exclude group: 'net.fabricmc.fabric-api'
//    }
//
//    modImplementation group: 'net.dblsaiko', name: 'libaddict', version: libaddict_version
//
//    modImplementation group: "net.dblsaiko.qcommon.croco", name: "croco", version: croco_version
//
//    modRuntimeOnly group: 'net.dblsaiko', name: 'winwonders', version: '0.1.2-4'
    // modRuntimeOnly(group: 'com.terraformersmc', name: 'modmenu', version: '2.0.0-beta.7') {
    //     exclude module: 'fabric-api'
    // }
}

processResources {
    from project(":xplat").sourceSets.main.resources
    inputs.property 'version', project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    source project(":xplat").sourceSets.main.kotlin
    kotlinOptions.jvmTarget = '21'
    kotlinOptions.freeCompilerArgs += '-Xjvm-default=all'
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
    source project(":xplat").sourceSets.main.java
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${archives_base_name}" }
    }
}

sourcesJar.configure {
    from(project(":xplat").sourceSets.main.allSource)
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${rootProject.name}-${project.name}"
            // add all the jars that should be included when publishing to maven
            from components.java
        }
    }

    // select the repositories you want to publish to
    repositories {
        // uncomment to publish to the local maven
        // mavenLocal()
    }
}

apply from: 'https://dblsaiko.net/pub/gradle/publish-slim.gradle'